/* ============================= DRAWERS ============================= */
const drawers = {brush:$('#drawerBrush'), color:$('#drawerColor'), layers:$('#drawerLayers')};
function toggleDrawer(name){
  const isOpen = drawers[name].classList.contains('open');
  Object.values(drawers).forEach(d=>d.classList.remove('open'));
  if(!isOpen) drawers[name].classList.add('open');
}
$('#btnToggleBrush').addEventListener('click', ()=>toggleDrawer('brush'));
$('#btnToggleColor').addEventListener('click', ()=>toggleDrawer('color'));
$('#btnToggleLayers').addEventListener('click', ()=>toggleDrawer('layers'));
document.querySelectorAll('.drawer [data-close]').forEach(b=> b.addEventListener('click', e=>{
  e.target.closest('.drawer').classList.remove('open');
}));

/* ============================= COLOR PICKER ============================= */
let curH=213, curS=0.72, curV=0.57;
function refreshFromHex(hex){
  const [r,g,b]=hexToRgb(hex); [curH,curS,curV]=rgbToHsv(r,g,b);
  drawSV(); drawHue(); positionColorCursors();
  $('#hexInput').value = hex.toUpperCase();
}
function drawHue(){
  const c = $('#hueBar'), ctx=c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,c.width,0);
  for(let i=0;i<=360;i+=30){ const [r,gg,b]=hsvToRgb(i,1,1); g.addColorStop(i/360, `rgb(${r},${gg},${b})`); }
  ctx.fillStyle=g; ctx.fillRect(0,0,c.width,c.height);
}
function drawSV(){
  const c = $('#svSquare'), ctx=c.getContext('2d');
  const [r,g,b] = hsvToRgb(curH,1,1);
  ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(0,0,c.width,c.height);
  let grad = ctx.createLinearGradient(0,0,c.width,0);
  grad.addColorStop(0,'rgba(255,255,255,1)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,c.width,c.height);
  grad = ctx.createLinearGradient(0,0,0,c.height);
  grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,c.width,c.height);
}
function positionColorCursors(){
  const svEl = $('#svSquare');
  const svRect = {w:svEl.clientWidth, h:svEl.clientHeight};
  $('#svCursor').style.left = (curS*svRect.w)+'px';
  $('#svCursor').style.top = ((1-curV)*svRect.h)+'px';
  const hueRect = {w:$('#hueBar').clientWidth};
  $('#hueCursor').style.left = (curH/360*hueRect.w)+'px';
}
function commitColor(){
  const [r,g,b]=hsvToRgb(curH,curS,curV);
  const hex = rgbToHex(r,g,b);
  setColor(hex,false);
  drawSV(); positionColorCursors();
}
function setColor(hex, updatePicker){
  hex = hex.toLowerCase();
  if(state.pickerTarget==='primary') state.primary=hex; else state.secondary=hex;
  $('#swatchPrimary').style.background='#'+state.primary;
  $('#swatchSecondary').style.background='#'+state.secondary;
  $('#colorRailSwatch').style.background='#'+state.primary;
  if(updatePicker) refreshFromHex('#'+hex);
  else $('#hexInput').value = hex.toUpperCase();
  addRecent(hex);
}
function addRecent(hex){
  state.recent = [hex, ...state.recent.filter(c=>c!==hex)].slice(0,16);
  renderRecent();
  localStorage.setItem('pigment.recent', JSON.stringify(state.recent));
}
function renderRecent(){
  const grid = $('#recentGrid'); grid.innerHTML='';
  state.recent.forEach(hex=>{
    const sw = el('div','sw'); sw.style.background='#'+hex;
    sw.addEventListener('click', ()=>{ setColor(hex,true); });
    grid.appendChild(sw);
  });
}
let svDragging=false, hueDragging=false;
$('#svSquare').addEventListener('pointerdown', e=>{ svDragging=true; e.target.setPointerCapture(e.pointerId); handleSV(e); });
$('#svSquare').addEventListener('pointermove', e=>{ if(svDragging) handleSV(e); });
window.addEventListener('pointerup', ()=>{ svDragging=false; hueDragging=false; });
function handleSV(e){
  const rect = $('#svSquare').getBoundingClientRect();
  curS = clamp((e.clientX-rect.left)/rect.width,0,1);
  curV = clamp(1-(e.clientY-rect.top)/rect.height,0,1);
  positionColorCursors(); commitColor();
}
$('#hueBar').addEventListener('pointerdown', e=>{ hueDragging=true; e.target.setPointerCapture(e.pointerId); handleHue(e); });
$('#hueBar').addEventListener('pointermove', e=>{ if(hueDragging) handleHue(e); });
function handleHue(e){
  const rect = $('#hueBar').getBoundingClientRect();
  curH = clamp((e.clientX-rect.left)/rect.width,0,1)*360;
  drawSV(); positionColorCursors(); commitColor();
}
$('#hexInput').addEventListener('change', e=>{
  let v = e.target.value.replace(/[^0-9a-fA-F]/g,'').slice(0,6);
  if(v.length!==6) v='000000';
  refreshFromHex('#'+v); setColor(v,false);
});
$('#swatchPrimary').addEventListener('click', ()=>{ state.pickerTarget='primary'; refreshFromHex('#'+state.primary); });
$('#swatchSecondary').addEventListener('click', ()=>{ state.pickerTarget='secondary'; refreshFromHex('#'+state.secondary); });
$('#btnSwapColor').addEventListener('click', ()=>{
  [state.primary, state.secondary] = [state.secondary, state.primary];
  $('#swatchPrimary').style.background='#'+state.primary;
  $('#swatchSecondary').style.background='#'+state.secondary;
  $('#colorRailSwatch').style.background='#'+state.primary;
});

/* ============================= BRUSH PANEL ============================= */
const TOOLTIPS = {
  size:'Diameter of the brush tip, in pixels.',
  sizeJitter:'Randomly varies each stamp’s size by up to this percent.',
  opacity:'Overall transparency of the whole stroke, applied once when you lift your finger/pencil.',
  flow:'How much paint each individual stamp lays down while you drag — low flow lets overlapping stamps build up darker.',
  opacityJitter:'Randomly varies each stamp’s opacity by up to this percent.',
  hardness:'How soft or hard the tip’s edge is (round and square shapes only).',
  spacing:'Distance between stamps along the stroke, as a percent of brush size. Lower = smoother line, higher = dotted/textured.',
  angle:'Base rotation of the brush tip, in degrees.',
  angleJitter:'Randomly rotates each stamp within this many degrees.',
  followDirection:'Rotates the tip to match the direction you’re drawing, instead of a fixed angle.',
  roundness:'Squashes the tip into an ellipse. 100% = full circle, lower = flatter (good for calligraphy nibs).',
  scatter:'Randomly offsets each stamp away from the stroke path.',
  scatterCount:'How many stamps get placed at each step along the stroke.',
  smoothing:'Smooths out shaky or jittery stroke input.',
  pressureSize:'Apple Pencil pressure controls stamp size — press harder for a bigger mark.',
  minSizePct:'The smallest the brush gets at zero pressure, as a percent of full size.',
  pressureOpacity:'Apple Pencil pressure controls stamp opacity — press harder for more opaque paint.',
};
function slider(labelText, key, min, max, step, fmt){
  const row = el('div','row');
  row.title = TOOLTIPS[key] || labelText;
  row.innerHTML = `<label>${labelText}</label><input type="range" min="${min}" max="${max}" step="${step}"><span class="val mono"></span>`;
  const input = row.querySelector('input'); const val = row.querySelector('.val');
  input.value = state.brush[key];
  val.textContent = fmt ? fmt(state.brush[key]) : state.brush[key];
  input.addEventListener('input', ()=>{
    state.brush[key] = parseFloat(input.value);
    val.textContent = fmt ? fmt(state.brush[key]) : input.value;
    refreshPresetHighlight();
  });
  row._sync = ()=>{ input.value=state.brush[key]; val.textContent = fmt?fmt(state.brush[key]):state.brush[key]; };
  return row;
}
function toggleRow(labelText, key, onChange){
  const row = el('div','toggle-row');
  row.title = TOOLTIPS[key] || labelText;
  row.innerHTML = `<label>${labelText}</label><div class="switch"></div>`;
  const sw = row.querySelector('.switch');
  const sync = ()=> sw.classList.toggle('on', !!state.brush[key]);
  sync();
  sw.addEventListener('click', ()=>{ state.brush[key]=!state.brush[key]; sync(); if(onChange) onChange(); });
  row._sync = sync;
  return row;
}
function section(title){
  const s = el('div','section');
  const head = el('div','section-title', `<span>${title}</span><span class="chev">▾</span>`);
  const body = el('div','section-content');
  head.addEventListener('click', ()=> s.classList.toggle('collapsed'));
  s.appendChild(head); s.appendChild(body);
  return {s, body};
}

let brushRowRefs = [];
function buildBrushPanel(){
  const root = $('#brushBody'); root.innerHTML=''; brushRowRefs=[];

  // Brush tip — every brush is a GIF/image now, this is the primary section
  {
    const {s,body} = section('Brush Tip (GIF / Image)');
    body.id = 'imageSection';
    root.appendChild(s);
    renderImageSection();
  }

  // Basic dynamics
  {
    const {s,body} = section('Size & Opacity');
    body.appendChild(slider('Size (px)','size',1,2000,1));
    brushRowRefs.push(body.lastChild);
    body.appendChild(slider('Size Jitter %','sizeJitter',0,100,1));
    body.appendChild(slider('Opacity %','opacity',1,100,1));
    body.appendChild(slider('Flow %','flow',1,100,1));
    body.appendChild(slider('Opacity Jitter %','opacityJitter',0,100,1));
    body.appendChild(slider('Spacing %','spacing',1,200,1));
    root.appendChild(s);
  }

  // Shape dynamics
  {
    const {s,body} = section('Angle & Scatter');
    body.appendChild(slider('Angle °','angle',0,360,1));
    body.appendChild(slider('Angle Jitter °','angleJitter',0,360,1));
    body.appendChild(toggleRow('Follow Stroke Direction','followDirection'));
    body.appendChild(slider('Roundness %','roundness',5,100,1));
    body.appendChild(slider('Scatter %','scatter',0,100,1));
    body.appendChild(slider('Scatter Count','scatterCount',1,8,1));
    body.appendChild(slider('Smoothing %','smoothing',0,100,1));
    root.appendChild(s);
  }

  // Pressure
  {
    const {s,body} = section('Pressure (Apple Pencil)');
    body.appendChild(toggleRow('Pressure → Size','pressureSize'));
    body.appendChild(slider('Min Size %','minSizePct',1,100,1));
    body.appendChild(toggleRow('Pressure → Opacity','pressureOpacity'));
    root.appendChild(s);
  }

  // Drop shadow
  {
    const {s,body} = section('Drop Shadow');
    const sh = state.brush.shadow;
    const toggle = el('div','toggle-row');
    toggle.title = 'Adds a shadow behind each stamp for a "sticker" look. Heavy blur can slow things down if you have many animated stamps on screen at once.';
    toggle.innerHTML = `<label>Enable Drop Shadow</label><div class="switch ${sh.enabled?'on':''}"></div>`;
    const fieldRows = [];
    toggle.querySelector('.switch').addEventListener('click', function(){
      sh.enabled = !sh.enabled;
      this.classList.toggle('on');
      fieldRows.forEach(r=> r.style.display = sh.enabled ? '' : 'none');
    });
    body.appendChild(toggle);
    function shadowSlider(labelText, key, min, max, step){
      const row = el('div','row');
      row.innerHTML = `<label>${labelText}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${sh[key]}"><span class="val mono">${sh[key]}</span>`;
      const input = row.querySelector('input'), val = row.querySelector('.val');
      input.addEventListener('input', ()=>{ sh[key]=parseFloat(input.value); val.textContent=input.value; });
      if(!sh.enabled) row.style.display='none';
      body.appendChild(row);
      fieldRows.push(row);
    }
    shadowSlider('Offset X','offsetX',-40,40,1);
    shadowSlider('Offset Y','offsetY',-40,40,1);
    shadowSlider('Blur','blur',0,40,1);
    shadowSlider('Opacity %','opacity',0,100,1);
    root.appendChild(s);
  }

  root.appendChild(el('div', null, `<div style="height:20px"></div>`));
}
function renderImageSection(){
  const body = $('#imageSection'); if(!body) return;
  body.innerHTML='';
  const box = el('div','upload-box', '📤 Tap to upload images or animated GIFs. Pick as many as you like: each one lands in the brush menu at the bottom.');
  const input = el('input'); input.type='file'; input.accept='image/*'; input.multiple=true; input.style.display='none';
  input.addEventListener('change', e=>{ loadImageBrushes(e.target.files); e.target.value=''; });
  box.addEventListener('click', ()=> input.click());
  body.appendChild(box); body.appendChild(input);

  const img = state.brush.image;
  if(!img){
    const hint = el('div', null, `<div style="font-size:11.5px;color:var(--text-dim);margin-top:6px;">Upload an image or animated GIF above (or drop a pile of them anywhere on the app). That's what this brush paints with. Nothing else works until you do.</div>`);
    body.appendChild(hint);
    return;
  }

  const strip = el('div','thumb-strip');
  img.frames.slice(0,24).forEach(f=>{
    const t = el('div','frame-thumb');
    const cv = document.createElement('canvas'); cv.width=40; cv.height=40;
    const cctx = cv.getContext('2d'); cctx.imageSmoothingEnabled = false;
    cctx.drawImage(f.canvas, 0,0,40,40);
    t.appendChild(cv);
    strip.appendChild(t);
  });
  body.appendChild(strip);
  if(img.frames.length>1){
    const info = el('div', null, `<div style="font-size:11.5px;color:var(--text-dim);margin:4px 0 8px;">${img.frames.length}-frame animated GIF — plays continuously once painted, at its own speed.</div>`);
    body.appendChild(info);
  }
  const lumRow = el('div','toggle-row'); lumRow.title='For flat scans/line art: turns brightness into transparency so a white background disappears.';
  lumRow.innerHTML=`<label>Use brightness as alpha (for scans)</label><div class="switch ${img.lumAlpha?'on':''}"></div>`;
  lumRow.querySelector('.switch').addEventListener('click', function(){ img.lumAlpha=!img.lumAlpha; this.classList.toggle('on'); buildProcessedFrames(img); renderImageSection(); });
  body.appendChild(lumRow);
  if(img.lumAlpha){
    const invRow = el('div','toggle-row'); invRow.title='Flips which brightness range becomes transparent.';
    invRow.innerHTML=`<label>Invert</label><div class="switch ${img.invert?'on':''}"></div>`;
    invRow.querySelector('.switch').addEventListener('click', function(){ img.invert=!img.invert; this.classList.toggle('on'); buildProcessedFrames(img); });
    body.appendChild(invRow);
  }
}
function isGifSource(name, type){ return type==='image/gif' || /\.gif$/i.test(name||''); }
/* Turns a file's bytes into brush frames. The bytes themselves are what gets saved,
   since the original file is far smaller than every frame stored as a PNG. */
function framesFromBytes(bytes, isGif){
  if(isGif){
    return new Promise((res,rej)=>{
      try{
        const {frames} = decodeGIF(bytes);
        if(!frames.length) rej(new Error('no frames')); else res(frames);
      }catch(err){ rej(err); }
    });
  }
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(new Blob([bytes]));
    const im = new Image();
    im.onload = ()=>{
      const c = document.createElement('canvas'); c.width=im.width; c.height=im.height;
      c.getContext('2d').drawImage(im,0,0);
      URL.revokeObjectURL(url);
      res([{canvas:c, delay:100}]);
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('not an image')); };
    im.src = url;
  });
}
function readFileBytes(file){
  return new Promise((res,rej)=>{
    const reader = new FileReader();
    reader.onload = ()=> res(reader.result);
    reader.onerror = ()=> rej(reader.error);
    reader.readAsArrayBuffer(file);
  });
}
/* One file or a whole pile: each becomes a brush in the menu, one after another, and the
   last one loaded is the brush in your hand. */
async function loadImageBrushes(fileList){
  const files = Array.from(fileList||[]).filter(f=> /^image\//.test(f.type) || /\.(gif|png|jpe?g|webp|bmp)$/i.test(f.name));
  if(!files.length){ if(fileList && fileList.length) toast('Those aren\'t images or GIFs'); return; }
  let added = 0, gifs = 0, frameCount = 0;
  const failed = [];
  for(let i=0;i<files.length;i++){
    const file = files[i];
    if(files.length>1) toast(`Loading ${i+1} of ${files.length}…`);
    try{
      const bytes = await readFileBytes(file);
      const isGif = isGifSource(file.name, file.type);
      const frames = await framesFromBytes(bytes, isGif);
      const img = makeImageWrapper(frames);
      img.source = {bytes, isGif};
      state.brush.image = img;
      autoSaveUploadToLibrary(file.name);
      added++; frameCount = frames.length;
      if(frames.length>1) gifs++;
    }catch(err){ failed.push(file.name); console.error(err); }
  }
  if(added){
    buildBrushPanel();
    // show the newest brushes at the end of the menu
    setTimeout(()=>{ const strip=$("#presetStrip"); strip.scrollLeft=strip.scrollWidth; }, 80);
  }
  if(files.length===1 && added){
    toast(frameCount>1 ? `Loaded GIF brush (${frameCount} frames) — it'll keep animating once you paint with it` : 'Loaded image brush');
  } else if(added){
    toast(`Added ${added} brush${added===1?'':'es'} to the menu${gifs?` (${gifs} animated)`:''}${failed.length?`. Couldn't read: ${failed.join(', ')}`:''}`);
  } else {
    toast(`Couldn't read ${failed.join(', ')}`);
  }
}
function loadImageBrush(file){ return loadImageBrushes([file]); }

/* ============================= PRESETS =============================
   Saved brushes live in IndexedDB (store "brushes"), not localStorage: a handful of GIFs is
   already past localStorage's ~5MB. Each preset's p.stored is what gets saved for its tip:
   {source:{bytes,isGif}} (the original file) or, for brushes saved before this, the older
   {frameData:[{dataURL,delay}]}; plus lumAlpha/invert. preset._liveImage always holds the
   actual usable {frames, processedFrames, lumAlpha, invert} wrapper, decoded once. */
function serializeImageForStorage(img){
  if(img.source) return {source:img.source, lumAlpha:img.lumAlpha, invert:img.invert};
  return {
    frameData: img.frames.map(f=>({dataURL:f.canvas.toDataURL('image/png'), delay:f.delay})),
    lumAlpha: img.lumAlpha, invert: img.invert,
  };
}
let lastPresetOrder = 0;
function nextPresetOrder(){ lastPresetOrder = Math.max(lastPresetOrder+1, Date.now()); return lastPresetOrder; }
function makePresetFromBrush(name){
  const plain = Object.assign({}, state.brush);
  delete plain.image;
  return {
    id:uid(), name, tool: state.tool==='eraser'?'eraser':'brush',
    params:JSON.parse(JSON.stringify(plain)), stored:serializeImageForStorage(state.brush.image),
    order:nextPresetOrder(), custom:true, _liveImage: cloneImageWrapper(state.brush.image),
  };
}
/* Every upload automatically lands in the brush menu (preset strip) — no extra "save" step
   needed just to be able to pick it again later. The manual "+" button still exists for
   saving a specifically-tuned variant (different size/spacing/etc) of whatever's loaded now. */
function autoSaveUploadToLibrary(filename){
  const base = (filename||'Upload').replace(/\.[^.]+$/,'').slice(0,40) || 'Upload';
  let name = base, n=2;
  while(state.brushes.some(p=>p.name===name)) name = `${base} ${n++}`;
  const p = makePresetFromBrush(name);
  state.brushes.push(p);
  savePreset(p);
  state.activeBrushId = p.id;
  schedulePresetStrip();
}
function deserializeImageFromPreset(data, cb){
  if(!data.frameData.length){ cb([]); return; }
  const frames = new Array(data.frameData.length);
  let remaining = data.frameData.length;
  data.frameData.forEach((fd,i)=>{
    const im = new Image();
    im.onload = ()=>{
      const c = document.createElement('canvas'); c.width=im.width; c.height=im.height;
      c.getContext('2d').drawImage(im,0,0);
      frames[i] = {canvas:c, delay:fd.delay};
      if(--remaining===0) cb(frames);
    };
    im.onerror = ()=>{ if(--remaining===0) cb(frames.filter(Boolean)); };
    im.src = fd.dataURL;
  });
}
function decodeStoredImage(stored){
  if(stored.source) return framesFromBytes(stored.source.bytes, stored.source.isGif);
  return new Promise(res=> deserializeImageFromPreset(stored, res));
}
function cloneImageWrapper(img){
  return {frames:img.frames, processedFrames:img.processedFrames||img.frames, lumAlpha:img.lumAlpha, invert:img.invert, source:img.source};
}
function presetRecord(p){ return {id:p.id, name:p.name, tool:p.tool, params:p.params, image:p.stored, order:p.order}; }
/* Fallback when IndexedDB is refused (Safari can do that for a page opened as a local file):
   keep brushes in localStorage the old way, file bytes as base64. Smaller limit, but they last. */
function bytesToB64(bytes){
  const u = new Uint8Array(bytes); let s = '';
  for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000));
  return btoa(s);
}
function b64ToBytes(b64){
  const s = atob(b64), u = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) u[i] = s.charCodeAt(i);
  return u.buffer;
}
function readLocalPresets(){ try{ return JSON.parse(localStorage.getItem('pigment.presets')||'[]'); }catch(e){ return []; } }
function saveLocalPreset(p){
  const image = p.stored && p.stored.source
    ? {source:{b64:bytesToB64(p.stored.source.bytes), isGif:p.stored.source.isGif}, lumAlpha:p.stored.lumAlpha, invert:p.stored.invert}
    : p.stored;
  const list = readLocalPresets().filter(o=>o.id!==p.id);
  list.push({id:p.id, name:p.name, tool:p.tool, order:p.order, params:Object.assign({}, p.params, {image})});
  localStorage.setItem('pigment.presets', JSON.stringify(list)); // throws when full
}
let presetSaveWarned = false;
async function savePreset(p){
  try{ await dbDo('brushes', 'readwrite', s=>s.put(presetRecord(p))); return; }
  catch(e){ console.error(e); }
  try{ saveLocalPreset(p); }
  catch(e){
    console.error(e);
    if(!presetSaveWarned){ presetSaveWarned = true; toast('Brush is in the menu, but this browser would not save it for next time'); }
  }
}
async function deletePreset(p){
  try{ await dbDo('brushes', 'readwrite', s=>s.delete(p.id)); }catch(e){}
  const list = readLocalPresets();
  if(list.some(o=>o.id===p.id)){ try{ localStorage.setItem('pigment.presets', JSON.stringify(list.filter(o=>o.id!==p.id))); }catch(e){} }
}
async function loadPresets(){
  let records = [];
  try{ records = (await dbDo('brushes', 'readonly', s=>s.getAll())) || []; }catch(e){ console.error(e); }
  // Brushes in localStorage (saved before the move to IndexedDB, or by the fallback when
  // IndexedDB was refused): carry them over, and free localStorage once that worked.
  const old = readLocalPresets();
  if(old.length){
    let moved = true;
    for(let i=0;i<old.length;i++){
      const o = old[i];
      if(records.some(r=>r.id===o.id) || !o.params || !o.params.image) continue;
      const params = Object.assign({}, o.params); delete params.image;
      let image = o.params.image;
      if(image.source && image.source.b64) image = Object.assign({}, image, {source:{bytes:b64ToBytes(image.source.b64), isGif:image.source.isGif}});
      const r = {id:o.id, name:o.name, tool:o.tool, params, image, order:o.order!=null ? o.order : i-old.length};
      records.push(r);
      try{ await dbDo('brushes', 'readwrite', s=>s.put(r)); }catch(e){ moved = false; }
    }
    if(moved){ try{ localStorage.removeItem('pigment.presets'); }catch(e){} }
  }
  records.sort((a,b)=>a.order-b.order);
  const loaded = records.map(r=>({id:r.id, name:r.name, tool:r.tool, params:r.params, stored:r.image, order:r.order, custom:true, _liveImage:null}));
  // anything uploaded while this was loading stays, after the saved ones
  state.brushes = loaded.concat(state.brushes.filter(p=>!loaded.some(l=>l.id===p.id)));
  schedulePresetStrip();
  for(const p of loaded){
    if(!p.stored) continue;
    try{
      const frames = await decodeStoredImage(p.stored);
      const img = {frames, processedFrames:null, lumAlpha:p.stored.lumAlpha, invert:p.stored.invert, source:p.stored.source};
      buildProcessedFrames(img);
      p._liveImage = img;
      schedulePresetStrip();
    }catch(e){ console.error('could not load brush', p.name, e); }
  }
}
function applyPreset(preset){
  // Only swap the tip image — size/spacing/opacity/etc are "sticky" settings the user is
  // dialing in and should never change just from picking a different brush/GIF from the menu.
  if(!preset._liveImage){ toast('Preset still loading…'); return; }
  state.activeBrushId = preset.id;
  state.brush.image = cloneImageWrapper(preset._liveImage);
  state.tool = preset.tool==='eraser' ? 'eraser' : (['pan','fill','eyedropper','smudge'].includes(state.tool) ? state.tool : 'brush');
  document.querySelectorAll('#toolGroup [data-tool]').forEach(b=>b.classList.toggle('active', b.dataset.tool===state.tool));
  buildBrushPanel();
  renderPresetStrip();
}
function renderPresetThumb(canvas, preset){
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!preset._liveImage) return;
  const tmp = Object.assign(document.createElement('canvas'),{width:64,height:64});
  const tctx = tmp.getContext('2d');
  const brush = Object.assign(defaultBrush(), preset.params, {image:preset._liveImage}); // defaults fill in settings an older save lacks
  for(let i=0;i<6;i++){
    const t=i/5;
    stampAt(tctx, brush, lerp(14,50,t), 32+Math.sin(t*6)*6, 0.8, 0);
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmp,0,0,canvas.width,canvas.height);
}
/* Loading a pile of brushes asks for a redraw after each one: draw the strip once for the lot. */
let presetStripQueued = false;
function schedulePresetStrip(){
  if(presetStripQueued) return;
  presetStripQueued = true;
  setTimeout(()=>{ presetStripQueued = false; renderPresetStrip(); }, 30); // a timer, not rAF: rAF stalls in background tabs
}
// thumbnails drawn once per preset and reused, so redrawing the strip stays cheap with many brushes
const presetThumbs = new WeakMap();
function renderPresetStrip(){
  const strip = $('#presetStrip');
  const scroll = strip.scrollLeft;
  strip.innerHTML='';
  state.brushes.forEach(p=>{
    const chip = el('div','preset-chip'+(p.custom?' custom':'')+(p.id===state.activeBrushId?' on':''));
    const cv = document.createElement('canvas'); cv.width=46; cv.height=46;
    chip.appendChild(cv);
    const del = el('div','del','✕');
    chip.appendChild(del);
    chip.title = p.name;
    chip.addEventListener('click', (e)=>{ if(e.target===del) return; applyPreset(p); });
    del.addEventListener('click', (e)=>{ e.stopPropagation(); state.brushes = state.brushes.filter(x=>x!==p); deletePreset(p); renderPresetStrip(); });
    strip.appendChild(chip);
    const cached = presetThumbs.get(p);
    if(cached && cached.image===p._liveImage) cv.getContext('2d').drawImage(cached.canvas,0,0);
    else setTimeout(()=>{
      renderPresetThumb(cv,p);
      if(p._liveImage){
        const keep = Object.assign(document.createElement('canvas'),{width:46,height:46});
        keep.getContext('2d').drawImage(cv,0,0);
        presetThumbs.set(p, {image:p._liveImage, canvas:keep});
      }
    },0);
  });
  const addBtn = el('button', null, '+'); addBtn.id='presetAdd';
  addBtn.addEventListener('click', ()=>{
    if(!state.brush.image){ toast('Upload an image or GIF first'); return; }
    showTextPromptModal('Name this brush preset', 'My Brush', (name)=>{
      const p = makePresetFromBrush(name);
      state.brushes.push(p); savePreset(p); state.activeBrushId=p.id; renderPresetStrip();
      toast('Preset saved');
    });
  });
  strip.appendChild(addBtn);
  strip.scrollLeft = scroll;
}
function refreshPresetHighlight(){ /* live edits don't rename preset; no-op for now */ }

/* ============================= LAYERS PANEL ============================= */
function renderLayers(){
  const body = $('#layersBody'); body.innerHTML='';
  for(let i=state.layers.length-1;i>=0;i--){
    const layer = state.layers[i];
    const row = el('div','layer-row'+(i===state.activeLayer?' active':''));
    row.innerHTML = `
      <button class="icon-btn" style="width:26px;height:26px;" data-vis title="Show/hide this layer">${layer.visible?'👁':'—'}</button>
      <canvas class="layer-thumb" width="40" height="40" title="${layer.name}"></canvas>
      <div class="layer-info">
        <div class="layer-name">${layer.name}</div>
        <div class="layer-meta">
          <select data-blend title="How this layer blends with the layers below it">${Object.keys(BLEND_MAP).map(k=>`<option value="${k}" ${k===layer.blend?'selected':''}>${k}</option>`).join('')}</select>
          <input type="range" min="0" max="100" value="${layer.opacity}" data-opacity title="Layer opacity">
        </div>
      </div>`;
    const thumb = row.querySelector('canvas');
    thumb.getContext('2d').drawImage(layer.canvas,0,0,40,40);
    row.addEventListener('click', (e)=>{
      if(e.target.closest('[data-vis]') || e.target.closest('select') || e.target.closest('input')) return;
      state.activeLayer = i; renderLayers();
    });
    row.querySelector('[data-vis]').addEventListener('click', (e)=>{ e.stopPropagation(); layer.visible=!layer.visible; compositeAll(false); renderLayers(); });
    row.querySelector('[data-blend]').addEventListener('change', (e)=>{ layer.blend=e.target.value; compositeAll(false); });
    row.querySelector('[data-opacity]').addEventListener('input', (e)=>{ layer.opacity=parseInt(e.target.value); compositeAll(false); });
    body.appendChild(row);
  }
}
function updateActiveLayerThumb(){ renderLayers(); }

$('#btnAddLayer').addEventListener('click', ()=>{
  pushHistory();
  state.layers.splice(state.activeLayer+1,0,makeLayer('Layer '+(state.layers.length+1)));
  state.activeLayer++; compositeAll(false); renderLayers();
});
$('#btnDupLayer').addEventListener('click', ()=>{
  pushHistory();
  const src = state.layers[state.activeLayer];
  const dup = makeLayer(src.name+' copy');
  dup.ctx.drawImage(src.canvas,0,0); dup.opacity=src.opacity; dup.blend=src.blend;
  dup.animatedStamps = src.animatedStamps.map(st=>Object.assign({},st));
  state.layers.splice(state.activeLayer+1,0,dup);
  state.activeLayer++; compositeAll(false); renderLayers(); ensureAnimLoop();
});
$('#btnDelLayer').addEventListener('click', ()=>{
  if(state.layers.length<=1) return toast("Can't delete the only layer");
  pushHistory();
  state.layers.splice(state.activeLayer,1);
  state.activeLayer = clamp(state.activeLayer,0,state.layers.length-1);
  compositeAll(false); renderLayers();
});
$('#btnMergeDown').addEventListener('click', ()=>{
  if(state.activeLayer===0) return toast('No layer below');
  pushHistory();
  const below = state.layers[state.activeLayer-1], cur = state.layers[state.activeLayer];
  below.ctx.save();
  below.ctx.globalAlpha = cur.opacity/100;
  below.ctx.globalCompositeOperation = BLEND_MAP[cur.blend]||'source-over';
  below.ctx.drawImage(cur.canvas,0,0);
  if(cur.animatedStamps.length) below.ctx.drawImage(cur.overlayCanvas,0,0);
  below.ctx.restore();
  state.layers.splice(state.activeLayer,1);
  state.activeLayer--; compositeAll(false); renderLayers();
});
$('#btnLayerUp').addEventListener('click', ()=>{
  const i=state.activeLayer; if(i>=state.layers.length-1) return;
  pushHistory();
  [state.layers[i],state.layers[i+1]]=[state.layers[i+1],state.layers[i]];
  state.activeLayer++; compositeAll(false); renderLayers();
});
$('#btnLayerDown').addEventListener('click', ()=>{
  const i=state.activeLayer; if(i<=0) return;
  pushHistory();
  [state.layers[i],state.layers[i-1]]=[state.layers[i-1],state.layers[i]];
  state.activeLayer--; compositeAll(false); renderLayers();
});
document.querySelectorAll('.layer-row .layer-name').forEach(()=>{});
$('#layersBody').addEventListener('dblclick', e=>{
  const row = e.target.closest('.layer-row'); if(!row) return;
  const idx = state.layers.length-1-[...row.parentNode.children].indexOf(row);
});

/* ============================= DROP FILES (desktop) =============================
   Drop any number of images/GIFs anywhere on the app to add them all as brushes. */
window.addEventListener("dragover", e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes("Files")) e.preventDefault(); });
window.addEventListener("drop", e=>{
  if(!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  loadImageBrushes(e.dataTransfer.files);
});

/* ============================= KEYBOARD (desktop convenience) ============================= */
window.addEventListener('keydown', e=>{
  // typing in a text box (save name, text tool, etc.) must never trigger drawing shortcuts
  if(e.target.closest && e.target.closest('input, textarea, select')) return;
  if(e.metaKey||e.ctrlKey){
    if(e.key==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
    else if(e.key==='z' && e.shiftKey){ e.preventDefault(); redo(); }
  } else if(e.key==='x'){ $('#btnSwapColor').click(); }
  else if(e.key==='['){ state.brush.size=clamp(state.brush.size-2,1,2000); buildBrushPanel(); }
  else if(e.key===']'){ state.brush.size=clamp(state.brush.size+2,1,2000); buildBrushPanel(); }
  else if(e.key==='Escape' && state.selectionPath){ clearSelection(); }
  else if((e.key==='Delete'||e.key==='Backspace') && state.selectionPath){ e.preventDefault(); deleteSelectionContents(); }
});

/* ============================= INIT ============================= */
function init(){
  try{ state.recent = JSON.parse(localStorage.getItem('pigment.recent')||'[]'); }catch(e){ state.recent=[]; }
  loadPresets();
  state.brush = defaultBrush();
  newDocument(1600,1200);
  refreshFromHex('#'+state.primary);
  $('#swatchPrimary').style.background='#'+state.primary;
  $('#swatchSecondary').style.background='#'+state.secondary;
  $('#colorRailSwatch').style.background='#'+state.primary;
  renderRecent();
  buildBrushPanel();
  renderPresetStrip();
  loadCustomFonts();
  drawers.brush.classList.add('open');
  window.addEventListener('resize', ()=>{ sizeStage(); });
}
function sizeStage(){ /* stage is flex-sized via CSS; nothing extra required */ }
window.addEventListener('DOMContentLoaded', init);
if(document.readyState!=='loading') init();

})();
</script>
