<style>
  /* GIF PIX commits to one bright, chunky, crayon-box look on purpose (a la classic kids'
     paint software) rather than adapting to light/dark host themes — background and every
     color are still painted explicitly so the page holds up regardless of host theme. */
  :root{
    --bg:#fef6e4;
    --surface:#ffffff;
    --surface-2:#fff0c9;
    --surface-3:#ffe37e;
    --border:#1a1a1a;
    --text:#241c15;
    --text-dim:#7a6a4f;
    --accent:#ff4d4d;
    --accent-text:#ffffff;
    --accent-ink:#2f80ff;
    --danger:#e0392b;
    --good:#2fae5a;
    --crayon-yellow:#ffc93c;
    --crayon-green:#3ecf6e;
    --crayon-purple:#9b59f6;
    --shadow: 5px 5px 0 var(--border);
    --shadow-sm: 3px 3px 0 var(--border);
    color-scheme: light;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:'Fredoka', 'Baloo 2', system-ui, sans-serif;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  #app{ position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); }

  /* ---------- Top bar ---------- */
  #topbar{
    height:56px; flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:0 10px; background:var(--surface); border-bottom:3px solid var(--border);
    z-index:40; position:relative;
    overflow-x:auto; overflow-y:hidden;
  }
  .brand{
    font-family:'Baloo 2', 'Fredoka', system-ui, sans-serif; font-weight:800; font-size:22px;
    letter-spacing:0.01em; padding:0 10px 0 4px; white-space:nowrap;
    -webkit-text-stroke:1.5px var(--border); text-shadow:2px 2px 0 var(--border);
  }
  .brand span{ color:var(--accent-ink); }
  .tb-group{ display:flex; align-items:center; gap:4px; padding:0 6px; border-right:2px solid var(--border); height:38px; }
  .tb-group:last-of-type{ border-right:none; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:12px; border:2px solid var(--border); background:var(--surface);
    color:var(--text); cursor:pointer; flex:0 0 auto; position:relative;
    box-shadow:var(--shadow-sm); font-size:17px;
  }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn:active{ transform:translate(2px,2px); box-shadow:none; }
  .icon-btn.active{ background:var(--accent); color:var(--accent-text); border-color:var(--border); }
  .icon-btn:disabled{ opacity:0.32; }
  #topbar .spacer{ flex:1; }
  #zoomLabel{ font-size:12px; color:var(--text-dim); min-width:44px; text-align:center; }
  .pill-btn{
    display:flex; align-items:center; gap:6px; height:38px; padding:0 14px; border-radius:12px;
    border:2px solid var(--border); background:var(--surface); color:var(--text); font-family:inherit;
    font-size:14px; font-weight:700; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .pill-btn.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--border); }
  .pill-btn:active{ transform:translate(2px,2px); box-shadow:none; }

  /* ---------- Stage ---------- */
  #stage{
    flex:1; position:relative; overflow:hidden;
    background:
      linear-gradient(45deg, var(--surface-3) 25%, transparent 25%) -11px 0/22px 22px,
      linear-gradient(-45deg, var(--surface-3) 25%, transparent 25%) -11px 0/22px 22px,
      linear-gradient(45deg, transparent 75%, var(--surface-3) 75%) -11px 0/22px 22px,
      linear-gradient(-45deg, transparent 75%, var(--surface-3) 75%) -11px 0/22px 22px,
      var(--surface-2);
    touch-action:none;
  }
  #canvasWrap{ position:absolute; left:0; top:0; transform-origin:0 0; }
  #canvasWrap canvas{ position:absolute; left:0; top:0; display:block; }
  #cursorGhost{
    position:absolute; pointer-events:none; border:1.5px solid var(--accent-ink);
    border-radius:50%; transform:translate(-50%,-50%); mix-blend-mode:difference;
    z-index:30; display:none;
  }

  /* ---------- Drawers ---------- */
  .drawer{
    position:absolute; top:8px; bottom:8px; width:300px; max-width:88vw;
    background:var(--surface); border:3px solid var(--border); border-radius:20px;
    box-shadow:var(--shadow); z-index:35; display:flex; flex-direction:column;
    transition:transform 0.18s ease;
    overflow:hidden;
  }
  .drawer.left{ left:60px; transform:translateX(-130%); }
  .drawer.left.open{ transform:translateX(0); }
  .drawer.right{ right:8px; transform:translateX(110%); }
  .drawer.right.open{ transform:translateX(0); }
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
    border-bottom:3px solid var(--border); flex:0 0 auto; background:var(--surface-3);
  }
  .drawer-head h2{ margin:0; font-family:'Baloo 2',sans-serif; font-size:15px; letter-spacing:0.02em; color:var(--text); font-weight:700; }
  .drawer-body{ flex:1; overflow-y:auto; overflow-x:hidden; padding:6px 14px 18px; }

  .section{ border-bottom:1px solid var(--border); padding:12px 0; }
  .section:last-child{ border-bottom:none; }
  .section-title{
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    font-family:'Baloo 2',sans-serif; font-size:13.5px; font-weight:700; letter-spacing:0.02em; color:var(--text);
    padding:2px 0 8px;
  }
  .section-title .chev{ color:var(--text-dim); transition:transform 0.15s; font-size:11px; }
  .section.collapsed .section-content{ display:none; }
  .section.collapsed .chev{ transform:rotate(-90deg); }

  .row{ display:flex; align-items:center; gap:8px; margin:9px 0; }
  .row label{ font-size:12.5px; color:var(--text-dim); flex:1; }
  .row .val{ font-size:11.5px; color:var(--text); width:38px; text-align:right; flex:0 0 auto; }
  input[type=range]{ flex:1.6; accent-color:var(--accent); height:22px; }
  select, .text-input{
    font-family:inherit; font-size:12.5px; background:var(--surface-2); color:var(--text);
    border:1px solid var(--border); border-radius:7px; padding:6px 8px;
  }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; margin:9px 0; }
  .toggle-row label{ font-size:12.5px; color:var(--text); }
  .switch{ position:relative; width:38px; height:22px; border-radius:11px; background:var(--surface-3); border:2px solid var(--border); cursor:pointer; flex:0 0 auto; }
  .switch.on{ background:var(--accent); }
  .switch::after{ content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:var(--surface); top:2px; left:2px; transition:left 0.15s; }
  .switch.on::after{ left:18px; background:#fff; }

  .seg{ display:flex; background:var(--surface-2); border-radius:8px; padding:2px; gap:2px; }
  .seg button{
    flex:1; border:none; background:transparent; padding:6px 4px; font-size:11.5px; font-weight:600;
    border-radius:6px; color:var(--text-dim); font-family:inherit; cursor:pointer;
  }
  .seg button.on{ background:var(--accent); color:var(--accent-text); }

  .shape-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .shape-cell{
    aspect-ratio:1; border-radius:9px; border:1.5px solid var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:6px;
  }
  .shape-cell.on{ border-color:var(--accent); background:var(--surface-3); }
  .shape-cell canvas{ width:100%; height:100%; }

  .upload-box{
    border:1.5px dashed var(--border); border-radius:10px; padding:14px; text-align:center;
    font-size:12px; color:var(--text-dim); cursor:pointer; margin:8px 0;
  }
  .upload-box:active{ background:var(--surface-2); }
  .thumb-strip{ display:flex; gap:6px; overflow-x:auto; padding:4px 0; }
  .frame-thumb{ width:36px; height:36px; border-radius:6px; border:1px solid var(--border); flex:0 0 auto; background:repeating-conic-gradient(var(--surface-3) 0 25%, transparent 0 50%) 0 0/10px 10px; }
  .frame-thumb img,.frame-thumb canvas{ width:100%; height:100%; object-fit:contain; border-radius:6px; }

  /* ---------- Color drawer ---------- */
  #hueBar, #svSquare{ border-radius:10px; touch-action:none; display:block; width:100%; }
  #svSquare{ height:180px; margin-bottom:10px; position:relative; }
  #hueBar{ height:18px; }
  .sv-cursor, .hue-cursor{ position:absolute; pointer-events:none; }
  .sv-cursor{ width:16px; height:16px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,0.4); transform:translate(-50%,-50%); }
  .swatch-row{ display:flex; align-items:center; gap:10px; margin:12px 0; }
  .swap-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
  .swatch-stack{ position:relative; width:44px; height:44px; }
  .swatch{ width:32px; height:32px; border-radius:9px; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--border); position:absolute; cursor:pointer; }
  .swatch.primary{ top:0; left:0; z-index:2; }
  .swatch.secondary{ bottom:0; right:0; z-index:1; }
  .swatch-grid{ display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-top:6px; }
  .swatch-grid .sw{ aspect-ratio:1; border-radius:6px; border:1px solid var(--border); cursor:pointer; }
  .hex-row{ display:flex; align-items:center; gap:8px; margin:10px 0; }
  .hex-row input{ flex:1; text-align:center; }

  /* ---------- Layers drawer ---------- */
  .layer-toolbar{ display:flex; gap:6px; padding:10px 14px; border-bottom:1px solid var(--border); }
  .layer-toolbar .icon-btn{ background:var(--surface-2); }
  .layer-row{

<script>
(function(){
'use strict';

/* ============================= UTILITIES ============================= */
const clamp = (v,a,b)=> Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=> a+(b-a)*t;
const rand = (a,b)=> a+Math.random()*(b-a);
const $ = sel => document.querySelector(sel);
const el = (tag, cls, html)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };

function hsvToRgb(h,s,v){
  h=((h%360)+360)%360; s=clamp(s,0,1); v=clamp(v,0,1);
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=60*(((g-b)/d)%6);
    else if(max===g) h=60*((b-r)/d+2);
    else h=60*((r-g)/d+4);
  }
  if(h<0) h+=360;
  const s = max===0?0:d/max, v=max;
  return [h,s,v];
}
function rgbToHex(r,g,b){ return [r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join(''); }
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"), Math.max(1600, msg.length*45)); // long ones (a pile of uploads) stay up long enough to read
}
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ============================= GIF DECODER ============================= */
function decodeGIF(buf){
  const data = new Uint8Array(buf);
  let p = 0;
  const u8 = ()=> data[p++];
  const u16 = ()=>{ const v = data[p] | (data[p+1]<<8); p+=2; return v; };
  p = 6; // skip signature "GIF89a"
  const width = u16(), height = u16();
  const packed = u8();
  const gctFlag = !!(packed & 0x80);
  const gctSize = 2 << (packed & 0x07);
  u8(); p++; // bg index, aspect
  function readColorTable(size){ const t=[]; for(let i=0;i<size;i++) t.push([u8(),u8(),u8()]); return t; }
  const gct = gctFlag ? readColorTable(gctSize) : null;

  function readSubBlocksRaw(){
    const bytes=[]; let size;
    while((size=u8())!==0){ for(let i=0;i<size;i++) bytes.push(u8()); }
    return bytes;
  }
  function skipSubBlocks(){ let size; while((size=u8())!==0){ p+=size; } }

  function lzwDecode(minCodeSize, bytes, pixelCount){
    const clearCode = 1<<minCodeSize, eoiCode = clearCode+1;
    let codeSize = minCodeSize+1, dict, output=[];
    function resetDict(){
      dict=[]; for(let i=0;i<clearCode;i++) dict[i]=[i];
      dict[clearCode]=[]; dict[eoiCode]=null; codeSize=minCodeSize+1;
    }
    resetDict();
    let bitBuf=0, bitLen=0, bytePos=0, prev=null;
    function readCode(){
      while(bitLen<codeSize){
        if(bytePos>=bytes.length) return eoiCode;
        bitBuf |= bytes[bytePos++] << bitLen; bitLen+=8;
      }
      const code = bitBuf & ((1<<codeSize)-1);
      bitBuf >>= codeSize; bitLen -= codeSize;
      return code;
    }
    while(output.length < pixelCount){
      const code = readCode();
      if(code===clearCode){ resetDict(); prev=null; continue; }
      if(code===eoiCode) break;
      let entry;
      if(dict[code]) entry=dict[code];
      else if(code===dict.length && prev) entry=prev.concat([prev[0]]);
      else break;
      for(let i=0;i<entry.length;i++) output.push(entry[i]);
      if(prev){
        dict.push(prev.concat([entry[0]]));
        if(dict.length===(1<<codeSize) && codeSize<12) codeSize++;
      }
      prev=entry;
    }
    return output;
  }
  function deinterlace(indices,w,h){
    const out = new Array(w*h);
    const passes=[[0,8],[4,8],[2,4],[1,2]];
    let src=0;
    for(const [start,step] of passes){
      for(let row=start; row<h; row+=step){
        for(let col=0; col<w; col++) out[row*w+col]=indices[src++];
      }
    }
    return out;
  }

  const frames = [];
  let transparentIndex=-1, delay=100, disposal=0;
  const accum = document.createElement('canvas'); accum.width=width; accum.height=height;
  const actx = accum.getContext('2d');
  let prevDisposal = 0, prevRect=null, prevSnapshot=null;

  while(p < data.length){
    const block = u8();
    if(block===0x21){
      const label=u8();
      if(label===0xF9){
        u8(); const pk=u8(); disposal=(pk>>2)&0x07; const transFlag=pk&0x01;
        delay = u16()*10; const ti=u8(); transparentIndex = transFlag?ti:-1; u8();
      } else { skipSubBlocks(); }
    } else if(block===0x2C){
      const left=u16(), top=u16(), w=u16(), h=u16();
      const pk=u8();
      const localCT = !!(pk&0x80), interlace = !!(pk&0x40), localSize = 2<<(pk&0x07);
      const colorTable = localCT ? readColorTable(localSize) : gct;
      const minCodeSize = u8();
      const raw = readSubBlocksRaw();
      let indices = lzwDecode(minCodeSize, raw, w*h);
      if(interlace) indices = deinterlace(indices, w, h);

      // apply previous frame's disposal before drawing this one
      if(prevDisposal===2 && prevRect){ actx.clearRect(prevRect.x,prevRect.y,prevRect.w,prevRect.h); }
      else if(prevDisposal===3 && prevSnapshot){ actx.putImageData(prevSnapshot,0,0); }

      if(disposal===3){ prevSnapshot = actx.getImageData(0,0,width,height); }

      const regionCanvas = document.createElement('canvas');
      regionCanvas.width=w; regionCanvas.height=h;
      const rctx = regionCanvas.getContext('2d');
      const imgData = rctx.createImageData(w,h);
      for(let i=0;i<w*h;i++){
        const idx = indices[i];
        const d = imgData.data;
        if(idx===transparentIndex || !colorTable || !colorTable[idx]){ d[i*4+3]=0; continue; }
        const c = colorTable[idx];
        d[i*4]=c[0]; d[i*4+1]=c[1]; d[i*4+2]=c[2]; d[i*4+3]=255;
      }
      rctx.putImageData(imgData,0,0);
      actx.drawImage(regionCanvas,left,top);

      const frameCanvas = document.createElement('canvas');
      frameCanvas.width=width; frameCanvas.height=height;
      frameCanvas.getContext('2d').drawImage(accum,0,0);
      frames.push({canvas:frameCanvas, delay:Math.max(20,delay)});

      prevDisposal = disposal; prevRect={x:left,y:top,w,h};
      disposal = 0; transparentIndex=-1;
    } else if(block===0x3B){ break; }
    else { break; }
  }
  return {width,height,frames};
}

/* ============================= APP STATE ============================= */
const CANVAS_MAX = 4096; // safe hard ceiling for a single canvas dimension on iPad Safari
const ZOOM_MIN = 0.02, ZOOM_MAX = 64;
const HISTORY_BUDGET_BYTES = 200*1024*1024; // ~200MB ceiling for the whole undo stack; a big
  // multi-layer canvas automatically gets a shallower history instead of risking memory
  // pressure on mobile — small documents keep the full depth.
let state = {
  tool:'brush',
  primary:'1b4b91', secondary:'ffffff',
  recent:[],
  pickerTarget:'primary',
  zoom:1, pan:{x:0,y:0},
  canvasSize:{w:1600,h:1200},
  activeLayer:0,
  layers:[],
  isDrawing:false,
  undoStack:[], redoStack:[],
  activeBrushId:'soft-round',
  brushes:[],
  brush:null,
  selectionPath:null,
};

function defaultBrush(overrides){
  return Object.assign({
    size:100, sizeJitter:0, minSizePct:20,
    opacity:100, flow:90, opacityJitter:0,
    spacing:10,
    angle:0, angleJitter:0, followDirection:false,
    roundness:100,
    scatter:0, scatterCount:1,
    pressureSize:true, pressureOpacity:false,
    image:null, // no brush shapes are built in — must upload an image/GIF before this brush can paint
    smoothing:35,
    shadow:{enabled:false, offsetX:6, offsetY:6, blur:8, opacity:55},
  }, overrides||{});
}

/* ============================= LAYERS ============================= */
function makeLayer(name){
  const c = document.createElement('canvas');
  c.width = state.canvasSize.w; c.height = state.canvasSize.h;
  const oc = document.createElement('canvas');
  oc.width = state.canvasSize.w; oc.height = state.canvasSize.h;
  return {id:uid(), name:name||'Layer', canvas:c, ctx:c.getContext('2d'), overlayCanvas:oc, animatedStamps:[], opacity:100, blend:'normal', visible:true};
}
const BLEND_MAP = {
  normal:'source-over', multiply:'multiply', screen:'screen', overlay:'overlay',
  darken:'darken', lighten:'lighten', 'color-dodge':'color-dodge', 'color-burn':'color-burn',
  difference:'difference', exclusion:'exclusion', hue:'hue', saturation:'saturation', color:'color', luminosity:'luminosity'
};

let viewCanvas, viewCtx, strokeBuffer, strokeCtx, canvasWrap, selectionCanvas, selectionCtx;

function initCanvasDom(){
  canvasWrap = $('#canvasWrap');
  canvasWrap.innerHTML='';
  viewCanvas = document.createElement('canvas');
  strokeBuffer = document.createElement('canvas');
  selectionCanvas = document.createElement('canvas');
  sizeCanvasesToState();
  canvasWrap.appendChild(viewCanvas);
  canvasWrap.appendChild(selectionCanvas);
  viewCtx = viewCanvas.getContext('2d');
  strokeCtx = strokeBuffer.getContext('2d');
  selectionCtx = selectionCanvas.getContext('2d');
}
function sizeCanvasesToState(){
  viewCanvas.width = state.canvasSize.w; viewCanvas.height = state.canvasSize.h;
  strokeBuffer.width = state.canvasSize.w; strokeBuffer.height = state.canvasSize.h;
  selectionCanvas.width = state.canvasSize.w; selectionCanvas.height = state.canvasSize.h;
}

function newDocument(w,h){
  state.canvasSize = {w:clamp(w,64,CANVAS_MAX), h:clamp(h,64,CANVAS_MAX)};
  state.layers = [makeLayer('Layer 1')];
  state.activeLayer = 0;
  state.undoStack=[]; state.redoStack=[];
  clearSelection();
  initCanvasDom();
  fitToScreen();
  compositeAll();
  renderLayers();
}

function cloneLayerCanvas(src){
  const c = document.createElement('canvas'); c.width=src.width; c.height=src.height;
  c.getContext('2d').drawImage(src,0,0);
  return c;
}
function snapshotLayers(){
  return state.layers.map(l=>({id:l.id,name:l.name,opacity:l.opacity,blend:l.blend,visible:l.visible,canvas:cloneLayerCanvas(l.canvas),animatedStamps:l.animatedStamps.slice()}));
}
function restoreLayers(entry){
  state.layers = entry.layers.map(l=>{
    const oc = document.createElement('canvas'); oc.width=l.canvas.width; oc.height=l.canvas.height;
    return {id:l.id,name:l.name,opacity:l.opacity,blend:l.blend,visible:l.visible,canvas:l.canvas,ctx:l.canvas.getContext('2d'),overlayCanvas:oc,animatedStamps:(l.animatedStamps||[]).slice()};
  });
  if(state.activeLayer >= state.layers.length) state.activeLayer = state.layers.length-1;
}
function pushHistory(){
  state.undoStack.push({layers:snapshotLayers(), activeLayer:state.activeLayer});
  const bytesPerSnapshot = Math.max(1,state.layers.length) * state.canvasSize.w * state.canvasSize.h * 4;
  const maxDepth = clamp(Math.floor(HISTORY_BUDGET_BYTES/bytesPerSnapshot), 3, 22);
  while(state.undoStack.length > maxDepth) state.undoStack.shift();
  state.redoStack.length=0;
}
function undo(){
  if(!state.undoStack.length) return toast('Nothing to undo');
  state.redoStack.push({layers:snapshotLayers(), activeLayer:state.activeLayer});
  const prev = state.undoStack.pop();
  restoreLayers(prev); state.activeLayer=prev.activeLayer;
  compositeAll(); renderLayers(); ensureAnimLoop();
}
function redo(){
  if(!state.redoStack.length) return toast('Nothing to redo');
  state.undoStack.push({layers:snapshotLayers(), activeLayer:state.activeLayer});
  const next = state.redoStack.pop();
  restoreLayers(next); state.activeLayer=next.activeLayer;
  compositeAll(); renderLayers(); ensureAnimLoop();
}

function compositeAll(showStroke){
  viewCtx.clearRect(0,0,viewCanvas.width,viewCanvas.height);
  for(const layer of state.layers){
    if(!layer.visible) continue;
    viewCtx.save();
    viewCtx.globalAlpha = layer.opacity/100;
    viewCtx.globalCompositeOperation = BLEND_MAP[layer.blend]||'source-over';
    viewCtx.drawImage(layer.canvas,0,0);
    if(layer.animatedStamps.length) viewCtx.drawImage(layer.overlayCanvas,0,0);
    viewCtx.restore();
  }
  if(showStroke){
    const layer = state.layers[state.activeLayer];
    viewCtx.save();
    viewCtx.globalAlpha = layer.opacity/100;
    viewCtx.globalCompositeOperation = state.tool==='eraser' ? 'destination-out' : 'source-over';
    viewCtx.globalAlpha *= (state.brush.opacity/100);
    viewCtx.drawImage(strokeBuffer,0,0);
    viewCtx.restore();
  }
}

/* ============================= LIVE GIF-STAMP ANIMATION ============================= */
let animRAF = null;
let animPaused = false;
let pausedElapsed = 0;   // total real ms spent paused so far, subtracted out of "effective" time
let pauseStartedAt = 0;
function getEffectiveNow(){
  return (animPaused ? pauseStartedAt : performance.now()) - pausedElapsed;
}
function setAnimPaused(paused){
  if(paused===animPaused) return;
  animPaused = paused;
  if(animPaused){
    pauseStartedAt = performance.now();
  } else {
    pausedElapsed += performance.now() - pauseStartedAt;
    ensureAnimLoop();
  }
  const btn = $('#btnPauseGifs');
  if(btn){ btn.classList.toggle('primary', animPaused); btn.innerHTML = animPaused ? '▶ Resume' : '⏸ Pause'; }
}
function renderAnimatedOverlays(now){
  let any = false;
  for(const layer of state.layers){
    if(!layer.animatedStamps.length) continue;
    any = true;
    if(layer.overlayCanvas.width!==layer.canvas.width || layer.overlayCanvas.height!==layer.canvas.height){
      layer.overlayCanvas.width = layer.canvas.width; layer.overlayCanvas.height = layer.canvas.height;
    }
    const octx = layer.overlayCanvas.getContext('2d');
    octx.clearRect(0,0,layer.overlayCanvas.width, layer.overlayCanvas.height);
    for(const st of layer.animatedStamps) drawAnimatedStamp(octx, st, now);
  }
  return any;
}
const ANIM_INTERVAL = 1000/15; // GIF frame delays are almost always 50ms+, so ~15fps is plenty and much cheaper than 60fps
let lastAnimRenderTime = 0;
function ensureAnimLoop(){
  if(animPaused){
    // Still reflect newly-added stamps at the frozen frame, but never start ticking.
    renderAnimatedOverlays(getEffectiveNow());
    compositeAll(!!strokeState);
    return;
  }
  if(animRAF) return; // already looping — it'll pick up newly-added stamps on its next tick
  renderAnimatedOverlays(getEffectiveNow());
  compositeAll(!!strokeState);
  lastAnimRenderTime = performance.now();
  const step = (rafNow)=>{
    if(animPaused){ animRAF = null; return; }
    if(rafNow - lastAnimRenderTime >= ANIM_INTERVAL){
      lastAnimRenderTime = rafNow;
      const any = renderAnimatedOverlays(getEffectiveNow());
      compositeAll(!!strokeState);
      if(!any && !strokeState){ animRAF = null; return; }
    }
    animRAF = requestAnimationFrame(step);
  };
  animRAF = requestAnimationFrame(step);
}
function drawAnimatedStamp(ctx, st, now){
  const frames = st.frames;
  let t = ((now - st.startTime + st.phase) % st.totalDelay + st.totalDelay) % st.totalDelay;
  let idx = frames.length-1;
  for(let i=0;i<frames.length;i++){ if(t < frames[i].delay){ idx=i; break; } t -= frames[i].delay; }
  const frameCanvas = frames[idx].canvas;
  const fitScale = Math.min(st.size/frameCanvas.width, st.size/frameCanvas.height);
  const dw = frameCanvas.width*fitScale, dh = frameCanvas.height*fitScale;
  ctx.save();
  ctx.translate(st.x, st.y);
  ctx.rotate(st.angle*Math.PI/180);
  ctx.scale(1, st.roundnessScale);
  ctx.globalAlpha = st.opacity;
  ctx.imageSmoothingEnabled = false; // GIFs scale with Nearest Neighbor: crisp pixels, no blur (Derek)
  if(st.shadow){
    ctx.shadowColor = `rgba(0,0,0,${st.shadow.opacity/100})`;
    ctx.shadowOffsetX = st.shadow.offsetX;
    ctx.shadowOffsetY = st.shadow.offsetY;
    ctx.shadowBlur = st.shadow.blur;
  }
  ctx.drawImage(frameCanvas, -dw/2, -dh/2, dw, dh);
  ctx.restore();
}
function eraseAnimatedStampsNear(x,y,radius){
  const layer = state.layers[state.activeLayer];
  if(!layer.animatedStamps.length) return;
  const before = layer.animatedStamps.length;
  layer.animatedStamps = layer.animatedStamps.filter(st=> Math.hypot(st.x-x, st.y-y) > radius + st.size*0.4);
  if(layer.animatedStamps.length!==before) requestComposite();
}

/* ============================= BRUSH ENGINE ============================= */
/* Every brush tip is a frame sequence (1 frame = static, 2+ = animated GIF) — the app has
   no built-in brush shapes at all. You must upload an image or GIF before you can paint. */
function makeImageWrapper(frames){
  const img = {frames, processedFrames:null, lumAlpha:false, invert:false};
  buildProcessedFrames(img);
  return img;
}

/* "Brightness as alpha" keeps the frame's own colors and only derives transparency from
   luminance (e.g. for a white-background scan) — it never recolors anything. */
function buildProcessedFrames(img){
  if(!img.lumAlpha){ img.processedFrames = img.frames; return; }
  img.processedFrames = img.frames.map(f=>{
    const c = document.createElement('canvas'); c.width=f.canvas.width; c.height=f.canvas.height;
    const cctx = c.getContext('2d');
    cctx.drawImage(f.canvas,0,0);
    const id = cctx.getImageData(0,0,c.width,c.height);
    for(let i=0;i<id.data.length;i+=4){
      let lum = (id.data[i]*0.299+id.data[i+1]*0.587+id.data[i+2]*0.114)/255;
      if(img.invert) lum = 1-lum;
      id.data[i+3] = Math.round(lum*255*(id.data[i+3]/255));
    }
    cctx.putImageData(id,0,0);
    return {canvas:c, delay:f.delay};
  });
}
function getCurrentImageFrame(brush){
  // Only used for the static (single-frame, non-animated) bake path — see beginStroke's isAnimated check.
  const frames = brush.image.processedFrames || brush.image.frames;
  return frames[0].canvas;
}

function stampAt(ctx, brush, x, y, pressure, headingDeg, sink, alsoPreview){
  let sizeMul = 1;
  if(brush.pressureSize) sizeMul = lerp(brush.minSizePct/100, 1, pressure);
  let size = brush.size * sizeMul * (1 + rand(-brush.sizeJitter,brush.sizeJitter)/100);
  size = Math.max(1, size);

  let opac = brush.flow/100;
  if(brush.pressureOpacity) opac *= lerp(0.15,1,pressure);
  opac *= (1 + rand(-brush.opacityJitter,brush.opacityJitter)/100);
  opac = clamp(opac,0,1);

  let angle = brush.angle + rand(-brush.angleJitter, brush.angleJitter);
  if(brush.followDirection) angle += headingDeg;
  const roundnessScale = clamp(brush.roundness/100,0.05,1);

  const shadow = brush.shadow && brush.shadow.enabled ? brush.shadow : null;

  const drawStatic = (ox,oy)=>{
    const frame = getCurrentImageFrame(brush);
    const fitScale = Math.min(size/frame.width, size/frame.height);
    const dw = frame.width*fitScale, dh = frame.height*fitScale;
    ctx.save();
    ctx.translate(x+ox, y+oy);
    ctx.rotate(angle*Math.PI/180);
    ctx.scale(1, roundnessScale);
    ctx.globalAlpha = opac;
    ctx.imageSmoothingEnabled = false; // Nearest Neighbor, same as the animated stamps
    if(shadow){
      ctx.shadowColor = `rgba(0,0,0,${shadow.opacity/100})`;
      ctx.shadowOffsetX = shadow.offsetX;
      ctx.shadowOffsetY = shadow.offsetY;
      ctx.shadowBlur = shadow.blur;
    }
    ctx.drawImage(frame, -dw/2, -dh/2, dw, dh);
    ctx.restore();
  };

  const doStamp = (ox,oy)=>{
    if(sink){
      const frames = brush.image.processedFrames || brush.image.frames;
      sink.push({
        x:x+ox, y:y+oy, angle, roundnessScale, opacity:opac, size, frames, shadow,
        startTime: getEffectiveNow(), phase: Math.random()*100000,
        totalDelay: frames.reduce((sum,f)=>sum+f.delay,0) || 100,
      });
      if(alsoPreview) drawStatic(ox,oy); // deferred mode: show something while dragging
      return;
    }
    drawStatic(ox,oy);
  };

  const count = Math.max(1, Math.round(brush.scatterCount));
  for(let i=0;i<count;i++){
    const sc = brush.scatter/100 * size * 0.6;
    const ox = count===1 && brush.scatter===0 ? 0 : rand(-sc,sc);
    const oy = count===1 && brush.scatter===0 ? 0 : rand(-sc,sc);
    doStamp(ox,oy);
  }
}

/* ---- stroke path handling ----
   Left-click (or touch/pen) draws normally: animated stamps go live the instant they're placed.
   Right-click draws in "deferred" mode instead: stamps are buffered with just a static preview
   while dragging, and only start animating (all in sync) once you let go — a different, more
   cohesive look for the same GIF brush. */
let strokeState = null;
function beginStroke(pt, deferred){
  pushHistory();
  strokeCtx.clearRect(0,0,strokeBuffer.width,strokeBuffer.height);
  const isAnimated = state.tool!=='eraser' && state.brush.image.frames.length>1;
  const isDeferred = isAnimated && !!deferred;
  strokeState = {
    last:pt, distAccum:0, pathLen:0, smoothX:pt.x, smoothY:pt.y, started:false,
    animated:isAnimated, deferred:isDeferred, buffer: isDeferred ? [] : null,
  };
  placeStampsAlong(pt, pt, pt.pressure);
  strokeState.started = true;
}
function moveStroke(pt, skipStamping){
  if(!strokeState) return;
  const sm = clamp(state.brush.smoothing,0,100)/100;
  const smoothed = { x: lerp(pt.x, strokeState.smoothX, sm*0.6), y: lerp(pt.y, strokeState.smoothY, sm*0.6), pressure: pt.pressure };
  strokeState.smoothX = smoothed.x; strokeState.smoothY = smoothed.y;
  // Skip connecting a stamped line across a big pointer jump — e.g. the pointer was
  // captured while sliding over the brush drawer (pointer capture keeps sending us events
  // even though it's visually over other UI), or briefly left the canvas. Just move the
  // tracking anchor so the next real segment starts fresh instead of teleporting a line.
  const jump = Math.hypot(smoothed.x-strokeState.last.x, smoothed.y-strokeState.last.y);
  const maxJump = Math.max(state.canvasSize.w, state.canvasSize.h) * 0.35;
  if(!skipStamping && jump <= maxJump){
    placeStampsAlong(strokeState.last, smoothed, pt.pressure);
  }
  strokeState.last = smoothed;
}
function endStroke(){
  if(!strokeState) return;
  const layer = state.layers[state.activeLayer];
  if(strokeState.deferred && strokeState.buffer.length){
    const now = getEffectiveNow();
    strokeState.buffer.forEach(st=>{ st.startTime = now; st.phase = 0; }); // all start in sync, together
    layer.animatedStamps.push(...strokeState.buffer);
    ensureAnimLoop();
  }
  // Animated (non-deferred) stamps were already pushed onto layer.animatedStamps as they were placed,
  // so strokeBuffer is empty for those — this bake is a no-op. For deferred strokes, strokeBuffer held
  // only a temporary static preview, which must NOT be baked now (the live overlay replaces it).
  if(!(strokeState.animated && strokeState.deferred)){
    layer.ctx.save();
    layer.ctx.globalCompositeOperation = state.tool==='eraser' ? 'destination-out' : 'source-over';
    layer.ctx.globalAlpha = state.brush.opacity/100;
    layer.ctx.drawImage(strokeBuffer,0,0);
    layer.ctx.restore();
  }
  strokeCtx.clearRect(0,0,strokeBuffer.width,strokeBuffer.height);
  strokeState = null;
  compositeAll(false);
  updateActiveLayerThumb();
}
function placeStampsAlong(from, to, pressure){
  const brush = state.brush;
  const step = Math.max(1.2, brush.size * clamp(brush.spacing,1,200)/100);
  const dx = to.x-from.x, dy = to.y-from.y;
  const dist = Math.hypot(dx,dy);
  const heading = Math.atan2(dy,dx)*180/Math.PI;

  if(dist===0){
    if(!strokeState.started) stampOnce(from.x,from.y,pressure,heading);
    return;
  }

  let nextStamp = step - strokeState.distAccum;
  let n = 0;
  while(nextStamp <= dist){
    const t = nextStamp/dist;
    const x = from.x + dx*t, y = from.y + dy*t;
    const p = lerp(from.pressure!==undefined?from.pressure:pressure, pressure, t);
    stampOnce(x,y,p,heading);
    nextStamp += step;
    if(++n>800) break;
  }
  strokeState.distAccum = (strokeState.distAccum + dist) % step;
  strokeState.pathLen += dist;
}
function stampOnce(x,y,pressure,heading){
  if(state.selectionPath && !pointInPolygon(x,y,state.selectionPath)) return;
  if(state.tool==='eraser'){
    eraseAnimatedStampsNear(x,y,state.brush.size/2);
  }
  let sink = null, alsoPreview = false;
  if(strokeState.animated){
    if(strokeState.deferred){ sink = strokeState.buffer; alsoPreview = true; }
    else { sink = state.layers[state.activeLayer].animatedStamps; }
  }
  stampAt(strokeCtx, state.brush, x, y, pressure, heading, sink, alsoPreview);
  if(sink && !strokeState.deferred) ensureAnimLoop();
  requestComposite();
}
let compositeRAF=null;
function requestComposite(){
  if(compositeRAF) return;
  compositeRAF = requestAnimationFrame(()=>{ compositeRAF=null; compositeAll(true); });
}

/* ============================= SMUDGE TOOL ============================= */
let smudgeLast=null;
function smudgeAt(x,y){
  if(state.selectionPath && !pointInPolygon(x,y,state.selectionPath)){ smudgeLast={x,y}; return; }
  const layer = state.layers[state.activeLayer];
  const r = state.brush.size/2;
  if(!smudgeLast){ smudgeLast={x,y}; return; }
  const ctx = layer.ctx;
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
  ctx.globalAlpha = clamp(state.brush.flow/100,0,1);
  ctx.drawImage(layer.canvas, smudgeLast.x-r, smudgeLast.y-r, r*2, r*2, x-r, y-r, r*2, r*2);
  ctx.restore();
  smudgeLast = {x,y};
  compositeAll(false);
}

/* ============================= FILL TOOL ============================= */
function floodFill(x,y,hex,tolerance){
  const layer = state.layers[state.activeLayer];
  const ctx = layer.ctx;
  const {width:w, height:h} = layer.canvas;
  x=Math.floor(x); y=Math.floor(y);
  if(x<0||y<0||x>=w||y>=h) return;
  const imgData = ctx.getImageData(0,0,w,h);
  const d = imgData.data;
  const idx = (y*w+x)*4;
  const target = [d[idx],d[idx+1],d[idx+2],d[idx+3]];
  const [fr,fg,fb] = hexToRgb(hex);
  const fillColor = [fr,fg,fb,255];
  const tol = tolerance*tolerance*3;
  const sel = state.selectionPath;
  function matches(i){
    const dr=d[i]-target[0], dg=d[i+1]-target[1], db=d[i+2]-target[2], da=d[i+3]-target[3];
    if((dr*dr+dg*dg+db*db+da*da) > tol) return false;
    if(sel){ const px=(i/4)%w, py=Math.floor((i/4)/w); if(!pointInPolygon(px,py,sel)) return false; }
    return true;
  }
  if(matches(idx) && fillColor[0]===target[0]&&fillColor[1]===target[1]&&fillColor[2]===target[2]&&target[3]===255) return;
  const stack=[[x,y]]; const visited = new Uint8Array(w*h);
  while(stack.length){
    const [cx,cy] = stack.pop();
    if(cx<0||cy<0||cx>=w||cy>=h) continue;
    const vi = cy*w+cx; if(visited[vi]) continue;
    const i = vi*4;
    if(!matches(i)) continue;
    visited[vi]=1;
    d[i]=fillColor[0]; d[i+1]=fillColor[1]; d[i+2]=fillColor[2]; d[i+3]=255;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  ctx.putImageData(imgData,0,0);
  compositeAll(false);
  updateActiveLayerThumb();
}

/* ============================= LASSO SELECTION =============================
   A selection is just a closed polygon in canvas-space (state.selectionPath). While one
   exists, brush/eraser/smudge/fill are all constrained to it via a cheap point-in-polygon
   test — good enough for a drawing tool without the cost of clipping every stamp on every
   animation frame. */
function pointInPolygon(x, y, path){
  let inside = false;
  for(let i=0, j=path.length-1; i<path.length; j=i++){
    const xi=path[i].x, yi=path[i].y, xj=path[j].x, yj=path[j].y;
    const intersect = ((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function renderSelectionOutline(){
  if(!selectionCtx) return;
  selectionCtx.clearRect(0,0,selectionCanvas.width,selectionCanvas.height);
  const path = state.selectionPath || state._lassoPoints;
  if(!path || path.length<2) { updateSelectionUI(); return; }
  selectionCtx.save();
  selectionCtx.lineWidth = Math.max(1, 1.5/state.zoom);
  selectionCtx.setLineDash([Math.max(3,6/state.zoom), Math.max(2,4/state.zoom)]);
  selectionCtx.strokeStyle = '#000';
  selectionCtx.beginPath();
  path.forEach((p,i)=> i===0?selectionCtx.moveTo(p.x,p.y):selectionCtx.lineTo(p.x,p.y));
  if(state.selectionPath) selectionCtx.closePath();
  selectionCtx.stroke();
  selectionCtx.strokeStyle = '#fff';
  selectionCtx.lineDashOffset = Math.max(3,6/state.zoom);
  selectionCtx.stroke();
  selectionCtx.restore();
  updateSelectionUI();
}
function updateSelectionUI(){
  const actionsEl = $('#selectionActions');
  if(actionsEl) actionsEl.style.display = state.selectionPath ? 'flex' : 'none';
}
function clearSelection(){
  state.selectionPath = null;
  state._lassoPoints = null;
  if(selectionCtx) selectionCtx.clearRect(0,0,selectionCanvas.width,selectionCanvas.height);
  updateSelectionUI();
}
function deleteSelectionContents(){
  if(!state.selectionPath) return;
  pushHistory();
  const layer = state.layers[state.activeLayer];
  layer.ctx.save();
  layer.ctx.beginPath();
  state.selectionPath.forEach((p,i)=> i===0?layer.ctx.moveTo(p.x,p.y):layer.ctx.lineTo(p.x,p.y));
  layer.ctx.closePath();
  layer.ctx.clip();
  layer.ctx.clearRect(0,0,layer.canvas.width,layer.canvas.height);
  layer.ctx.restore();
  layer.animatedStamps = layer.animatedStamps.filter(st=> !pointInPolygon(st.x, st.y, state.selectionPath));
  compositeAll(false);
  updateActiveLayerThumb();
  toast('Deleted selection contents');
}

/* ============================= POINTER / INPUT ============================= */
const activePointers = new Map();
let pinchStart=null;

function getLocalPoint(e){
  const rect = viewCanvas.getBoundingClientRect();
  const scaleX = viewCanvas.width/rect.width, scaleY = viewCanvas.height/rect.height;
  return {
    x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY,
    pressure: e.pressure>0 ? e.pressure : (e.pointerType==='mouse'?1:0.5)
  };
}
function isOverChrome(clientX, clientY){
  const els = [$('#topbar'), $('#rail'), $('#presetStrip'), drawers.brush, drawers.color, drawers.layers];
  for(const chromeEl of els){
    if(!chromeEl) continue;
    const r = chromeEl.getBoundingClientRect();
    if(clientX>=r.left && clientX<=r.right && clientY>=r.top && clientY<=r.bottom) return true;
  }
  return false;
}

let forcedPan = false;
function onPointerDown(e){
  if(e.target.closest('.drawer, #rail, #presetStrip')) return;
  if(e.pointerType==='mouse' && e.button===1){
    e.preventDefault();
    forcedPan = true;
    state.isDrawing = true;
    state._panStart = {x:e.clientX, y:e.clientY, pan:{...state.pan}};
    return;
  }
  const rightClick = e.pointerType==='mouse' && e.button===2;
  $('#stage').setPointerCapture && e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if(activePointers.size===2){
    strokeState=null; smudgeLast=null;
    const pts=[...activePointers.values()];
    pinchStart = {
      dist:Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y),
      zoom:state.zoom,
      mid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},
      pan:{...state.pan}
    };
    return;
  }
  if(activePointers.size>1) return;
  e.preventDefault();
  const pt = getLocalPoint(e);
  if(state.tool==='brush' || state.tool==='eraser'){
    if(!state.brush.image){ toast('Upload an image or GIF first'); return; }
    state.isDrawing=true; beginStroke(pt, rightClick);
  } else if(rightClick){
    // right-click only draws (in "deferred" mode) — no effect on other tools
  } else if(state.tool==='lasso'){
    state.isDrawing=true;
    state.selectionPath = null;
    state._lassoPoints = [pt];
    renderSelectionOutline();
  } else if(state.tool==='smudge'){
    state.isDrawing=true; pushHistory(); smudgeLast=null; smudgeAt(pt.x,pt.y);
  } else if(state.tool==='fill'){
    pushHistory(); floodFill(pt.x,pt.y,'#'+state.primary,24);
  } else if(state.tool==='text'){
    showTextToolModal(pt);
  } else if(state.tool==='eyedropper'){
    pickColorFromCanvas(pt.x,pt.y);
  } else if(state.tool==='pan'){
    state.isDrawing=true; state._panStart={x:e.clientX,y:e.clientY, pan:{...state.pan}};
  }
  updateGhost(e);
}
function onPointerMove(e){
  if(forcedPan){
    if(!state.isDrawing) return;
    state.pan.x = state._panStart.pan.x + (e.clientX-state._panStart.x);
    state.pan.y = state._panStart.pan.y + (e.clientY-state._panStart.y);
    applyTransform();
    return;
  }
  if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size===2 && pinchStart){
    const pts=[...activePointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const mid = {x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
    const newZoom = clamp(pinchStart.zoom * (dist/pinchStart.dist), ZOOM_MIN, ZOOM_MAX);
    state.zoom = newZoom;
    state.pan.x = pinchStart.pan.x + (mid.x-pinchStart.mid.x);
    state.pan.y = pinchStart.pan.y + (mid.y-pinchStart.mid.y);
    applyTransform();
    return;
  }
  updateGhost(e);
  if(activePointers.size>1) return;
  if(!state.isDrawing) return;
  const pt = getLocalPoint(e);
  // Pointer capture keeps sending us move events for the drawing pointer even while it's
  // visually over the brush/color/layers drawers, the rail, the preset strip, or the top
  // bar — without this check those regions would get bridged into the stroke/lasso path,
  // producing a long "teleporting" line the instant the cursor re-enters the canvas.
  const overChrome = isOverChrome(e.clientX, e.clientY);
  if(state.tool==='brush' || state.tool==='eraser'){ moveStroke(pt, overChrome); }
  else if(state.tool==='lasso'){
    if(!overChrome){
      const last = state._lassoPoints[state._lassoPoints.length-1];
      if(Math.hypot(pt.x-last.x, pt.y-last.y) > 2/state.zoom){ state._lassoPoints.push(pt); renderSelectionOutline(); }
    }
  }
  else if(state.tool==='smudge'){ if(overChrome) smudgeLast=null; else smudgeAt(pt.x,pt.y); }
  else if(state.tool==='pan'){
    state.pan.x = state._panStart.pan.x + (e.clientX-state._panStart.x);
    state.pan.y = state._panStart.pan.y + (e.clientY-state._panStart.y);
    applyTransform();
  }
}
function onPointerUp(e){
  if(forcedPan){ forcedPan=false; state.isDrawing=false; return; }
  activePointers.delete(e.pointerId);
  if(activePointers.size<2) pinchStart=null;
  if(!state.isDrawing) return;
  state.isDrawing=false;
  if(state.tool==='brush' || state.tool==='eraser'){ endStroke(); }
  else if(state.tool==='lasso'){
    state.selectionPath = (state._lassoPoints && state._lassoPoints.length>=3) ? state._lassoPoints : null;
    state._lassoPoints = null;
    renderSelectionOutline();
    if(!state.selectionPath) toast('Selection too small — try again');
  }
  smudgeLast=null;
}
function updateGhost(e){
  const ghost = $('#cursorGhost');
  if(isOverChrome(e.clientX, e.clientY)){ ghost.style.display='none'; return; }
  if(state.tool!=='brush' && state.tool!=='eraser' && state.tool!=='smudge'){ ghost.style.display='none'; return; }
  const rect = $('#stage').getBoundingClientRect();
  ghost.style.display='block';
  ghost.style.left=(e.clientX-rect.left)+'px';
  ghost.style.top=(e.clientY-rect.top)+'px';
  const sizeCss = state.brush.size * state.zoom;
  ghost.style.width = sizeCss+'px'; ghost.style.height=sizeCss+'px';
}
function pickColorFromCanvas(x,y){

stage.addEventListener('wheel', (e)=>{
  if(e.target.closest('.drawer, #rail, #presetStrip')) return;
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const before = state.zoom;
  // scale by how far the wheel/trackpad actually moved, capped at the old fixed step, so a
  // normal mouse wheel notch feels the same but Mac trackpad scroll/pinch (many tiny events) is smooth
  const dy = e.deltaMode===1 ? e.deltaY*33 : e.deltaY;
  const factor = clamp(Math.exp(-dy*(e.ctrlKey ? 0.01 : 0.0015)), 0.93, 1.08);
  state.zoom = clamp(state.zoom*factor, ZOOM_MIN, ZOOM_MAX);
  state.pan.x = mx - (mx-state.pan.x)*(state.zoom/before);
  state.pan.y = my - (my-state.pan.y)*(state.zoom/before);
  applyTransform();
}, {passive:false});

function applyTransform(){
  canvasWrap.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
  $('#zoomLabel').textContent = Math.round(state.zoom*100)+'%';
  if(state.selectionPath) renderSelectionOutline();
}
function fitToScreen(){
  const rect = stage.getBoundingClientRect();
  const pad=40;
  const scale = Math.min((rect.width-pad*2)/state.canvasSize.w, (rect.height-pad*2)/state.canvasSize.h, 2);
  state.zoom = clamp(scale, ZOOM_MIN, ZOOM_MAX);
  state.pan.x = (rect.width-state.canvasSize.w*state.zoom)/2;
  state.pan.y = (rect.height-state.canvasSize.h*state.zoom)/2;
  applyTransform();
}

async function saveFile(filename, buf, blobForFallback){

/* ============================= ANIMATED EXPORT =============================
   Renders the full composite (all layers' raster + their animated overlay AT AN ARBITRARY
   TIME) into any destination context/size — used both by the live app nowhere else, and by
   the animated video exporter below, which drives it forward over real time via rAF while
   MediaRecorder captures the result. This intentionally does NOT touch the live viewCanvas
   or layer.overlayCanvas, so exporting never disturbs what's on screen. */
function renderCompositeAtTime(destCtx, destW, destH, time){
  destCtx.clearRect(0,0,destW,destH);
  const cw = state.canvasSize.w, ch = state.canvasSize.h;
  for(const layer of state.layers){
    if(!layer.visible) continue;
    destCtx.save();
    destCtx.globalAlpha = layer.opacity/100;
    destCtx.globalCompositeOperation = BLEND_MAP[layer.blend]||'source-over';
    destCtx.drawImage(layer.canvas, 0,0,cw,ch, 0,0,destW,destH);
    if(layer.animatedStamps.length){
      if(!layer._exportScratch){ layer._exportScratch = document.createElement('canvas'); }
      const sc = layer._exportScratch;
      if(sc.width!==cw || sc.height!==ch){ sc.width=cw; sc.height=ch; }
      const sctx = sc.getContext('2d');
      sctx.clearRect(0,0,cw,ch);
      for(const st of layer.animatedStamps) drawAnimatedStamp(sctx, st, time);
      destCtx.drawImage(sc, 0,0,cw,ch, 0,0,destW,destH);
    }
    destCtx.restore();
  }
}
function pickVideoMimeType(){
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return null;
  const candidates = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return candidates.find(m=> MediaRecorder.isTypeSupported(m)) || null;
}
async function exportAnimatedVideo(durationSec, filenameBase){
  const mimeType = pickVideoMimeType();
  const canDoIt = mimeType && document.createElement('canvas').captureStream;
  if(!canDoIt){ toast('Animated video export isn\'t supported in this browser — try Static PNG instead'); return; }

  const w = state.canvasSize.w, h = state.canvasSize.h; // full resolution — matches the original artwork
  const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
  const ctx = canvas.getContext('2d');

  const EXPORT_FPS = 30;
  const stream = canvas.captureStream(EXPORT_FPS);
  const track = stream.getVideoTracks()[0];
  const recorder = new MediaRecorder(stream, {mimeType, videoBitsPerSecond: 8000000});
  const chunks = [];
  recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };

  // The live view's own animation loop competes with this export loop for the same JS
  // thread — pause it for the duration of the recording so frame pacing stays smooth.
  // (The visible canvas will hold still while this runs; that's expected, not a freeze.)
  const wasLooping = !!animRAF;
  if(animRAF){ cancelAnimationFrame(animRAF); animRAF = null; }

  toast(`Recording ${durationSec}s animated export…`);
  const startTime = getEffectiveNow();
  const t0 = performance.now();
  let rafId;
  function tick(){
    const elapsed = performance.now()-t0;
    renderCompositeAtTime(ctx, w, h, startTime+elapsed);
    if(track.requestFrame) track.requestFrame();
    if(elapsed < durationSec*1000) rafId = requestAnimationFrame(tick);
  }
  const blob = await new Promise(resolve=>{
    recorder.onstop = ()=> resolve(new Blob(chunks, {type:mimeType}));
    recorder.start();
    tick();
    setTimeout(()=>{ cancelAnimationFrame(rafId); recorder.stop(); }, durationSec*1000 + 200);
  });
  if(wasLooping) ensureAnimLoop();
  const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
  const buf = await blob.arrayBuffer();
  await saveFile(`${filenameBase}.${ext}`, buf, blob);
  toast(`Saved animated ${ext.toUpperCase()}`);
}

/* ============================= TEXT TOOL + CUSTOM FONTS =============================
   Click the canvas with the Text tool to open a modal, type, pick a font, place it.
   Text is drawn in the primary color onto the active layer (undoable like Fill).
   Users can add their own font files; those are registered with FontFace and kept
   in IndexedDB (font files can be several MB, too big for localStorage). */
const BUILTIN_FONTS = ['Baloo 2','Fredoka','JetBrains Mono','Helvetica','Arial','Georgia','Times New Roman',
  'Courier New','Comic Sans MS','Impact','Futura','Avenir','Marker Felt','Chalkboard SE','American Typewriter','Papyrus'];
const customFonts = []; // [{name}]
state.textOpts = {font:'Baloo 2', size:96, bold:false, italic:false};

// One IndexedDB for everything too big for localStorage: custom fonts and saved brushes.
let gifpixDB = null;
function openDB(){
  if(gifpixDB) return Promise.resolve(gifpixDB);
  return new Promise((res,rej)=>{
    const req = indexedDB.open('gifpix', 2);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains('fonts')) db.createObjectStore('fonts', {keyPath:'name'});
      if(!db.objectStoreNames.contains('brushes')) db.createObjectStore('brushes', {keyPath:'id'});
    };
    req.onsuccess = ()=>{ gifpixDB = req.result; res(gifpixDB); };
    req.onerror = ()=> rej(req.error);
    setTimeout(()=> rej(new Error('IndexedDB did not open')), 4000); // some browsers just never answer
  });
}
async function dbDo(store, mode, fn){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(store, mode);
    const r = fn(tx.objectStore(store));
    tx.oncomplete = ()=> res(r && r.result);
    tx.onerror = ()=> rej(tx.error);
    tx.onabort = ()=> rej(tx.error);
  });
}
function fontDBDo(mode, fn){ return dbDo('fonts', mode, fn); }
async function registerFont(name, data){
  const face = new FontFace(name, data);
  await face.load();
  document.fonts.add(face);
  if(!customFonts.some(f=>f.name===name)) customFonts.push({name, face});
}
/* Fallback when IndexedDB is refused, same as saved brushes: fonts go in localStorage as
   base64. A big font may not fit there; small and medium ones do. */
const LOCAL_FONTS_KEY = 'gifpix.fonts';
function readLocalFonts(){ try{ return JSON.parse(localStorage.getItem(LOCAL_FONTS_KEY)||'[]'); }catch(e){ return []; } }
function writeLocalFonts(list){
  if(list.length) localStorage.setItem(LOCAL_FONTS_KEY, JSON.stringify(list)); // throws when full
  else localStorage.removeItem(LOCAL_FONTS_KEY);
}
async function loadCustomFonts(){
  let all = [];
  try{ all = (await fontDBDo('readonly', s=>s.getAll())) || []; }catch(e){ /* IndexedDB refused: localStorage ones below */ }
  // fonts kept by the fallback: move them into IndexedDB once it works
  const local = readLocalFonts();
  if(local.length){
    let moved = true;
    for(const lf of local){
      if(all.some(f=>f.name===lf.name)) continue;
      const f = {name:lf.name, data:b64ToBytes(lf.b64)};
      all.push(f);
      try{ await fontDBDo('readwrite', s=>s.put(f)); }catch(e){ moved = false; }
    }
    if(moved){ try{ writeLocalFonts([]); }catch(e){} }
  }
  for(const f of all){ try{ await registerFont(f.name, f.data); }catch(e){} }
}
async function addFontFile(file){
  let name = file.name.replace(/\.(ttf|otf|woff2?)$/i,'').replace(/[^\w \-]/g,' ').trim() || 'My Font';
  const base = name; let n = 2;
  while(customFonts.some(f=>f.name===name) || BUILTIN_FONTS.includes(name)) name = `${base} ${n++}`;
  const data = await file.arrayBuffer();
  await registerFont(name, data);   // throws if the file isn't a real font
  try{ await fontDBDo('readwrite', s=>s.put({name, data})); return name; }catch(e){}
  try{ writeLocalFonts(readLocalFonts().filter(f=>f.name!==name).concat([{name, b64:bytesToB64(data)}])); }
  catch(e){ toast('Font added for this session (too big to save for next time in this browser)'); }
  return name;
}
async function removeCustomFont(name){
  const i = customFonts.findIndex(f=>f.name===name);
  if(i<0) return;
  try{ document.fonts.delete(customFonts[i].face); }catch(e){}
  customFonts.splice(i,1);
  try{ await fontDBDo('readwrite', s=>s.delete(name)); }catch(e){}
  const local = readLocalFonts();
  if(local.some(f=>f.name===name)){ try{ writeLocalFonts(local.filter(f=>f.name!==name)); }catch(e){} }
}
function textFontString(o, size){
  return `${o.italic?'italic ':''}${o.bold?'bold ':''}${size}px "${o.font}", sans-serif`;
}
function drawTextOnLayer(text, pt){
  const o = state.textOpts, layer = state.layers[state.activeLayer];
  pushHistory();
  const ctx = layer.ctx;
  ctx.save();
  ctx.font = textFontString(o, o.size);
  ctx.fillStyle = '#'+state.primary;
  ctx.textBaseline = 'top';
  text.split('\n').forEach((line,i)=> ctx.fillText(line, pt.x, pt.y + i*o.size*1.2));
  ctx.restore();
  compositeAll(false);
  renderLayers();
}
